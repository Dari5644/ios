# مثال إعداد Nginx كـ Reverse Proxy أمام الباك إند + شهادة SSL عبر Certbot
# ضعه في /etc/nginx/sites-available/mw3-arena-api ثم فعّله بـ:
#   sudo ln -s /etc/nginx/sites-available/mw3-arena-api /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d api.mw3arena.com
#   sudo systemctl reload nginx

server {
    listen 80;
    server_name api.mw3arena.com;   # غيّره لدومين الباك إند الفعلي

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;      # ضروري لأن Socket.io يحتاج WebSocket
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
